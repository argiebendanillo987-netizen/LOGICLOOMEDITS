.container {
    max-width: 680px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.profile-img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
    border: 3px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
}

.username {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

.subtitle {
    font-size: 0.9rem;
    color: #f1e3d6;
    margin-bottom: 2rem;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

.link-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 1rem;
    text-align: center;
    background-color: rgba(255, 255, 255, 0.14);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 600;
    font-size: 1rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
}

.link-btn:hover {
    background-color: #ffffff;
    color: #2a1a3a;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 140, 60, 0.35);
}

footer {
    margin-top: 3rem;
    font-size: 0.85rem;
    opacity: 0.8;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}
</style>
</head>
